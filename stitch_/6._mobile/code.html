  <div class="min-h-[884px] flex flex-col pb-32" data-stitch-vh="min-h-[884px]===min-h-screen">

        </div>

      </div>

        <button type="button" title="Налаштування ШІ" aria-label="Налаштування ШІ" class="w-11 h-11 rounded border border-dark-border bg-dark-background text-dark-ai inline-flex items-center justify-center relative">
          <span class="material-symbols-outlined text-lg">auto_awesome</span>
          <span class="w-2 h-2 rounded-full bg-dark-success absolute top-2 right-2"></span>
        </button>
        <button type="button" title="Профіль та утиліти" aria-label="Меню профілю" class="w-11 h-11 rounded border border-dark-border bg-dark-background text-dark-secondary inline-flex items-center justify-center">
          <span class="material-symbols-outlined text-lg">more_horiz</span>
        </button>
      </div>
    </header>

          <h2 class="font-section text-section-title text-dark-primary uppercase">2. Суть звернення</h2>
        </div>

        <label class="flex flex-col gap-gutter-xs">
          <span class="font-label text-label-md text-dark-secondary">Категорія суб&#39;єкта права <span class="text-dark-error">*</span></span>
          <div class="relative">

        </div>
      </section>

      <section id="md-sec-8" class="bg-dark-surface border border-dark-border rounded-lg p-gutter-md flex flex-col gap-gutter-sm">
        <div class="flex items-center gap-gutter-sm">
          <span class="px-2 py-0.5 rounded-sm bg-dark-ai-container text-dark-primary font-label text-label-sm">08</span>
          <h2 class="font-section text-section-title text-dark-primary uppercase">8. Службовий лист</h2>
        </div>

        <span class="font-label text-label-md text-dark-secondary">Додаткова інформація (на адвоката)</span>

    <div role="alert" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-gutter-md py-2 rounded-full bg-dark-error-container border border-dark-error-border text-dark-error shadow-xl flex items-center gap-1.5 whitespace-nowrap">

      <span class="font-label text-label-sm">Заповніть обов&#39;язкові поля!</span>

    <footer class="fixed bottom-0 inset-x-0 z-40 bg-dark-surface border-t border-dark-border px-gutter-md py-gutter-sm flex items-center gap-gutter-sm shadow-lg">
